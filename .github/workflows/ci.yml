name: tests
on: [push, pull_request]

jobs:
  quality:
    # Lint, format and types once, on the oldest supported Python (the strictest for syntax).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Type check (mypy, config in pyproject.toml)
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests (includes the pinned offline evaluation report)
        run: pytest
      - name: Evaluation on the labelled synthetic dataset
        run: python -m triage_agent evaluate
