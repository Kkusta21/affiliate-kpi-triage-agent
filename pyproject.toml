[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affiliate-kpi-triage-agent"
version = "0.2.0"
description = "AI agent that triages KPI drops on affiliate campaigns: finds the root cause, opens an incident and drafts the alert."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["langchain>=0.3", "langchain-openai>=0.2", "langchain-anthropic>=0.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
triage = "triage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage_agent = ["static/*.html"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# Checked: src/ only. Tests use dynamic fixtures and scripted fakes on purpose.
files = ["src"]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
# Optional extra (pip install -e ".[llm]"), imported lazily in make_llm.
module = ["langchain", "langchain.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
